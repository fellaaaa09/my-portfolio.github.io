<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="contact">
<div id="navbar"></div>
<main class="container py-5">
  <h2 class="mb-4">Contact</h2>
  <div class="row justify-content-center"><div class="col-md-8 col-lg-6">
    <form id="formKontak" class="panel">
      <div class="mb-3"><label class="form-label" for="nama">Nama</label><input id="nama" class="form-control" required></div>
      <div class="mb-3"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label" for="pesan">Pesan</label><textarea id="pesan" rows="5" class="form-control" required></textarea></div>
      <button class="btn btn-abu w-100" type="submit">Kirim pesan</button>
    </form>
    <div class="text-center mt-4">
      <a id="ig" class="ig-link" target="_blank" rel="noopener" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
    </div>
  </div></div>
</main>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
